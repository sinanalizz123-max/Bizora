name: Release signed APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        shell: bash
        run: |
          printf '%s' '${{ secrets.BIZMANAGER_KEYSTORE_BASE64 }}' \
            | base64 -d > "$RUNNER_TEMP/business-manager-release.jks"
          chmod 600 "$RUNNER_TEMP/business-manager-release.jks"

      - name: Build signed release APK
        env:
          BIZMANAGER_KEYSTORE_PATH: ${{ runner.temp }}/business-manager-release.jks
          BIZMANAGER_KEYSTORE_PASSWORD: ${{ secrets.BIZMANAGER_KEYSTORE_PASSWORD }}
          BIZMANAGER_KEY_ALIAS: ${{ secrets.BIZMANAGER_KEY_ALIAS }}
          BIZMANAGER_KEY_PASSWORD: ${{ secrets.BIZMANAGER_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: jarsigner -verify app/build/outputs/apk/release/app-release.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          asset="BusinessManager-${GITHUB_REF_NAME}.apk"
          title="Business Manager ${GITHUB_REF_NAME}"
          body="Signed release APK built by CI for tag ${GITHUB_REF_NAME}."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${apk}#${asset}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${apk}#${asset}" \
              --title "$title" --notes "$body"
          fi
